name: Validate notes

on:
  push:
    branches: [main]
    paths: ['notes/**']
  workflow_dispatch:

concurrency:
  group: halomoon-notes-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          repository: Hole333/HolyLinux
          path: site
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          path: site/external-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Prepare Markdown metadata
        run: node site/external-notes/scripts/manage-notes.mjs prepare
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run build
        working-directory: site
